# Installer delivery catalog. Remote sources (git / npm / market / backup)
# are downloaded at prepare time and packed into build/installer-catalog/
# for offline first-run seed. Plugin tarballs embed non-host production deps
# (bundleDependencies); first launch unpacks them without registry.npmjs.org.
# Override the file with DSH_INSTALLER_FLAVOR=/path/to/flavor.yml.
#
# Plugin from types: git, local, npm, market, backup.
# A dshmarket profile backup (format: dsh-profile-backup, version: 0.2) expands
# into every community plugin, then each is fetched and packed:
#   - kind: plugin
#     from: backup
#     path: ./test/fixtures/installer-flavor/dsh-dshmarket-backup-example.json
#
# An MCP server reachable over the network adds one more source: kind: mcp with
# from: remote, where the URL is the whole source — nothing to download or pack,
# so the catalog only carries the row the first-run seed mounts.
name: DSH Desktop
version: 0.11.0-2
sources:
  # Official market host. Pinned exactly, not by range: this is the version the
  # offline seed installs, so it stays reproducible and at or above
  # VERIFIED_MARKET_BASELINE (src/main/state/market-baseline.ts), which carries
  # the same version. The app itself depends on no dshmarket copy since upstream
  # #478 (a packaged copy shadowed the profile one), so these two are the pair
  # that has to move together.
  - kind: plugin
    from: npm
    spec: dshmarket@1.66.22
  # Pinned by commit, not `#main`: the catalog must carry exactly the code the
  # release names. This commit is v0.2.9 (`@wingsky-1/dsh-mcp-manager` 0.2.9) —
  # the maintenance release that restores Windows config saving and protects
  # externally edited server entries.
  - kind: plugin
    from: git
    url: https://github.com/wingsky-1/dsh-plugin-hub.git#97cc69f0add5f4e999461df4590737c33b0376fc
    path: packages/dsh-mcp-manager
  # Web search for the model. From npm rather than from the git tree: `./dist` is
  # a build artifact the repository does not commit, so packing #main produced a
  # plugin whose `bin` entry (`./dist/main.js`) did not exist — the tool started
  # and died with MODULE_NOT_FOUND. The published tarball is the built one, and
  # the exact pin keeps two installs of one build identical.
  - kind: plugin
    from: npm
    spec: "@liustack/modsearch@5.10.6"
  # v0.26.0 is the release upstream names for the 0.2.0 host line: every host peer
  # is `^0.2.0-rc.2`, which is exactly the core this bundle carries (`^0.2.0-rc.1`
  # of the previous pin also accepted it, so the move narrows nothing — it stops
  # lagging behind the line our core is on). A host that does not satisfy a peer
  # range gets the row rejected or silently disabled, so the pin follows the core
  # line.
  - kind: plugin
    from: git
    url: https://github.com/omdsh-dev/DSH-better-sidebar.git#v0.26.0
  # Pinned by commit (v0.4.6, `@linxin666/dsh-client-ui-skill-explorer` 0.4.6).
  # Its host peer is `>=0.2.0-rc.2` — the same statement as the sidebar above:
  # the release is built against the core line this bundle carries.
  - kind: plugin
    from: git
    url: https://github.com/zhu1090093659/dsh-web.git#3cd18493de81dc2ac4b6ee17677325765d7e84bd
    path: packages/dsh-skill-explorer
  # From npm, not from the git tree, for the same reason as modsearch below:
  # `integrations/deepseek-harness/skills` is in that directory's .gitignore and
  # is materialized only by its `scripts/pack.mjs` (a staged copy of the skill at
  # pack time). Packing the git tree therefore produced a plugin whose provider
  # points at a `skills/` directory that does not exist — it installed and
  # activated cleanly, and `skill("archify")` answered "unknown or no longer
  # available", because the skill service listed nothing. The published tarball
  # is the packed one and the only adapter build upstream ever released: 1.0.0 is
  # the same skill-only bundle, re-published 2026-10-04, and its tarball was
  # checked to carry the payload (`skills/archify/**`, `lib/index.js`, LICENSE).
  - kind: plugin
    from: npm
    spec: "@tt-a1i/archify-dsh@1.0.0"
  # Наши 1С-плагины. Пин по коммиту, а не `#main`: сборка должна доставать ровно
  # тот код, который в неё попал. 0.6.x — плагин владеет жизненным циклом
  # MCP-сервера справки по API платформы (vendor/bsl-context-rs 0.20.0 внутри
  # пакета) и не поднимает его, пока не задан путь к платформе.
  - kind: plugin
    from: git
    url: https://github.com/Mempemp/DSH-1CProjectProperties.git#7e7db3b9acd945e1bc0a33b63ed0f201b7a0a1e4
    path: dsh-1c-project-properties
  - kind: plugin
    from: git
    url: https://github.com/Mempemp/DSH-runner-rlm-tools-bsl.git#663e7a1bbdab78f9f5a4d04e7bd35d4873f3ef62
    path: dsh-rlm-tools-bsl
  # v0.6.2: приём и отклонение изменений в файле, отметки «просмотрено» (живут по
  # изменениям, переживают коммит и отправку в индекс), подсказка редактора
  # полоской сверху. Хостовые пиры — `^0.1.0-rc.6 || ^0.2.0-rc.1`, то есть
  # ядро 0.2.0-rc.2 сборки диапазоном принимается.
  - kind: plugin
    from: git
    url: https://github.com/Mempemp/DSH-CodeEditor_BSL.git#d65be2f47e6340efa7be0b11e44f591f8ec0cfcc
    path: dsh-bsl-editor
  # Russian localization for the web UI. Pinned exactly for the same reason as
  # the market above: the offline seed must stay reproducible, and a floating
  # range would silently change what a release delivers. Its dsh-settings peer
  # names `^0.2.0-rc.2`, the version this bundle installs — a stale pin is not a
  # start failure, it kills the plugin on an unknown API and leaves the interface
  # English (see references/shell-ui-locale.md). Smart UX stays off by default —
  # src/main/state/plugin-defaults-seed.ts pins those toggles.
  - kind: plugin
    from: npm
    spec: "@goodandready/dsh-russian-lang@0.3.45"
  # Русские уведомления: наш компонент сборки, а не установка из маркета. Апстрим
  # (@wingsky-1/dsh-notifier 0.2.7, автор тот же, что у mcp-manager и market) отдаёт
  # текст уведомлений и страницу настроек только на китайском и английском, выбора
  # языка у него нет. Здесь лежит его сборка с русским текстом: дельта — данные в
  # packages/dsh-notifier-ru/tools/, манифест и LICENSE (MIT, © wingsky-1),
  # пересборка — `node tools/localize.mjs`. `from: local`, потому что апстрим
  # публикуется уже собранным и правится именно сборка.
  - kind: plugin
    from: local
    path: ./packages/dsh-notifier-ru
  # Univer office documents (spreadsheets, decks, docs) with inline previews and
  # a floating worktree window. Taken from the market: `dsh-univer-office` is the
  # npm name its catalog entry carries (owner dream-num), so the offline seed and
  # the market install the same package.
  - kind: plugin
    from: npm
    spec: dsh-univer-office@0.3.7
  # Public 1C knowledge MCP (v8std): platform documentation search, БСП / SSL and
  # standards. `from: remote` because there is nothing to vendor — the installer
  # seeds the server into the MCP manager's global store
  # ($DSH_HOME/@wingsky-1/dsh-mcp-manager/mcp.json,
  # the list its panel shows), so it is available in every project without a
  # per-project setup and can be switched off there like any other server. Its
  # tools appear to the model as mcp__v8std__<tool>.
  - kind: mcp
    from: remote
    id: v8std
    serverName: v8std
    transport: streamable-http
    url: https://ai.v8std.ru/mcp
  # Локальная память агента: engram (MIT, Go) приезжает отдельным плагином со
  # своим репозиторием — в бандле для неё ничего не вендорится. Внутри пакета
  # и правила, и MCP-половина (бинарник engram + шим); строку сервера в
  # менеджере ($DSH_HOME/@wingsky-1/dsh-mcp-manager/mcp.json) плагин добавляет себе сам при первом
  # старте. Пин по коммиту, как у остальных наших.
  - kind: plugin
    from: git
    url: https://github.com/Mempemp/dsh-engram-memory.git#f2f28e9fb126ea44182f3cedc5410fb35ee3f19e
  # 1C ruleset as one tree, seeded to $DSH_HOME/1c-rules/payload.json + content/.
  # Delivered as a payload and nothing else: the skills inside it cross-reference
  # AGENTS.md, content/rules/* and content/agents/*, so shipping the skills tree
  # on its own — the global $DSH_HOME/skills, which every project sees — would
  # hand the agent pointers into files that are not there. The whole tree is
  # unpacked into a project on demand by dsh-1c-project-properties, which
  # rewrites the source-repository paths to the project-local ones the header of
  # each file expects. The desktop never reads this payload itself.
  # Pinned to a commit, not `#main`: a floating ref would hand two installs of the
  # same build different rulesets. `version` feeds the catalog fingerprint: bump
  # it (or let the tree digest change) or an existing install keeps its old copy.
  # 96c4d96 — правила 1c-metadata-manage (поля ввода Tuning/Opening/StartListChoice,
  # внешние отчёты могут называть общие формы конфигурации), дефолтный адрес
  # поддержки, память и детали операций грузятся по требованию.
  - kind: payload
    from: git
    url: https://github.com/comol/ai_rules_1c.git#96c4d96ad22b4d2751a9298147c76e8ea73aea4c
    id: 1c-rules
    name: 1c-rules
    version: 2026.10.14-96c4d96
