# Installer delivery catalog. Remote sources (git / npm / market / backup)
# are downloaded at prepare time and packed into build/installer-catalog/
# for offline first-run seed. Plugin tarballs embed non-host production deps
# (bundleDependencies); first launch unpacks them without registry.npmjs.org.
# Override the file with DSH_INSTALLER_FLAVOR=/path/to/flavor.yml.
#
# Plugin from types: git, local, npm, market, backup.
# A dshmarket profile backup (format: dsh-profile-backup, version: 0.2) expands
# into every community plugin, then each is fetched and packed:
#   - kind: plugin
#     from: backup
#     path: ./test/fixtures/installer-flavor/dsh-dshmarket-backup-example.json
#
# An MCP server reachable over the network adds one more source: kind: mcp with
# from: remote, where the URL is the whole source — nothing to download or pack,
# so the catalog only carries the row the first-run seed mounts.
name: DSH Desktop
version: 0.2.2-rc.1-1

# Плагины, которые каталог больше не поставляет. Профиль, обновлённый с прошлой сборки,
# продолжает их грузить иначе: они владеют теми же /rlm/*, что и движок внутри
# dsh-1c-project-properties, второй apply падает и теряет свои маршруты (/1cprops/*).
retired:
  - dsh-rlm-tools-bsl
sources:
  # Локальная редакция (packages/dsh-mcp-manager), а не установка из git/npm: апстрим
  # держит нагрузку каждого ждущего вызова записи каталога инструментов, и на машине с
  # несколькими MCP-серверами хост умирает по OOM (issue #3 в нашем репозитории).
  # Сборка — `node packages/dsh-mcp-manager/tools/patch.mjs` поверх опубликованного
  # @wingsky-1/dsh-mcp-manager@0.2.11 с проверкой контрольной суммы архива и бандла;
  # наш номер 0.2.12 (свой счётчик правок поверх базовой версии апстрима).
  # Имя не меняем: на нём держатся $DSH_HOME/@wingsky-1/dsh-mcp-manager/mcp.json, сид
  # каталога и профили пользователей. База 0.2.11 объявляет пиры 0.2.2-rc.1 — это и есть
  # ядро сборки; у прежней 0.2.10 пиры были точной версией 0.2.1-rc.2, и на новой линии
  # гейт хоста отверг бы плагин целиком, а панель MCP просто исчезла бы.
  - kind: plugin
    from: local
    path: ./packages/dsh-mcp-manager
  # Web search for the model. From npm rather than from the git tree: `./dist` is
  # a build artifact the repository does not commit, so packing #main produced a
  # plugin whose `bin` entry (`./dist/main.js`) did not exist — the tool started
  # and died with MODULE_NOT_FOUND. The published tarball is the built one, and
  # the exact pin keeps two installs of one build identical.
  - kind: plugin
    from: npm
    spec: "@liustack/modsearch@5.10.11"
  # v0.30.1 is built for the core line this bundle carries: every host peer is
  # `^0.2.2-rc.1` and Cordis `^4.0.5` (core 0.2.2-rc.1, Cordis 4.1.0). The old pin
  # (v0.28.0) names the 0.2.1 line; keeping it after the core bump would leave the
  # sidebar on APIs the new runtime no longer has.
  - kind: plugin
    from: git
    url: https://github.com/omdsh-dev/DSH-better-sidebar.git#v0.30.1
  # Pinned by commit (v0.4.15, `@linxin666/dsh-client-ui-skill-explorer` 0.4.15).
  # Its host peer is `>=0.2.2-rc.1` — the same statement as the sidebar above:
  # the release is built against the core line this bundle carries, so it moves
  # together with the core bump and not later.
  - kind: plugin
    from: git
    url: https://github.com/zhu1090093659/dsh-web.git#e8cc1955bab16cd6acecdefd5259d8b2531a98a2
    path: packages/dsh-skill-explorer
  # From npm, not from the git tree, for the same reason as modsearch below:
  # `integrations/deepseek-harness/skills` is in that directory's .gitignore and
  # is materialized only by its `scripts/pack.mjs` (a staged copy of the skill at
  # pack time). Packing the git tree therefore produced a plugin whose provider
  # points at a `skills/` directory that does not exist — it installed and
  # activated cleanly, and `skill("archify")` answered "unknown or no longer
  # available", because the skill service listed nothing. The published tarball
  # is the packed one and the only adapter build upstream ever released: 1.0.0 is
  # the same skill-only bundle, re-published 2026-10-04, and its tarball was
  # checked to carry the payload (`skills/archify/**`, `lib/index.js`, LICENSE).
  - kind: plugin
    from: npm
    spec: "@tt-a1i/archify-dsh@1.0.0"
  # Наши 1С-плагины. Пин по коммиту, а не `#main`: сборка должна доставать ровно
  # тот код, который в неё попал. 0.9.0 — движок rlm-tools-bsl переехал внутрь этого
  # плагина (бывший отдельный `dsh-rlm-tools-bsl`): автозапуск MCP-сервера анализа
  # кода, автоустановка через `uv`, индексы проектов через `rlm-bsl-index`, своя
  # вкладка настроек. Роуты остались под `/rlm/*`, а каталог `$DSH_HOME/rlm-tools-bsl`
  # тем же, поэтому установленный движок и его Python-окружение переживают обновление.
  # Отдельной строкой раннер больше не подключается — второй экземпляр дрался бы за порт.
  # 0.10.0 — движок 1.47.0 (схема индекса v18) и поведение карточки индекса: при
  # stale_structure она больше не запускает update сама, флаги берутся из параметров
  # проекта, папка выгрузки задаётся настройкой.
  # 0.10.1 — вендоренный сервер справки bsl-context-rs 0.21.5 → 0.23.1 (MIT, ассет
  # bsl-context-windows-x64.zip): ложные находки в проверках модулей, KEYWORDS по
  # грамматике, NFC-имена в lite-индексе.
  # Релиз 0.10.1 переиздан с исправлением индексации: причина отказа берётся из вывода
  # движка (а не «код 1»), а окончательный отказ не повторяется каждую секунду опросом
  # карточки.
  # 0.15.0: правила 1С разворачиваются своим слоем (девять плейбуков в самом пакете),
  # comol стал необязательным флажком и правится только по нему; проверка кода —
  # 210 правил на движке bsl-analyzer (0.4.3 едет в установщике, в $DSH_HOME/bsl-analyzer);
  # 1С:Напарник отдельным MCP-сервером с одним инструментом, бюджетом ключа и
  # `bsl_review` как «вторым мнением». Всё это выключено по умолчанию, кроме правил.
  # 0.11.0: таймауты индексации выведены в настройки плагина и перестали быть ошибкой —
  # проверка свежести 15 мин вместо 60 с (на слабой машине и сетевом диске обход дерева дольше),
  # сборка 4 ч вместо часа; сработавший предел читается как «состав файлов не проверен», а не
  # «состояние неизвестно».
  - kind: plugin
    from: git
    url: https://github.com/Mempemp/DSH-1CProjectProperties.git#5e745904f7c2cc42c56e84bfad78534115aa92cf
    path: dsh-1c-project-properties
  # v0.8.1: «не git-репозиторий» — состояние папки, а не отказ git; последняя
  # ошибка привязана к папке проекта и не видна в настройках другого проекта.
  # v0.8.0: git работает без установки в системе, не плодит процессы и называет
  # причину отказа; вбирает 0.7.0–0.7.5.
  # v0.7.0: git для диффов, индикаторов изменений и кнопок «В индекс» / «Коммит»
  # ищется сам — путь из настроек → комплектная копия в `$DSH_HOME/git` (её
  # распаковывает строка `kind: tool` ниже) → PATH → места установки Git for
  # Windows; состояние Git видно в настройках «1С-редактор». Плюс кнопка
  # «Обновить дерево», сбрасывающая кэши листингов и разобранных метаданных.
  # Хостовые пиры — `^0.1.0-rc.6 || ^0.2.0-rc.1`: ядро сборки принимается диапазоном.
  # v0.9.0: `git status` на большой выгрузке и сетевом диске больше не обрывается по 60 с —
  # предел чтения 300 с и поле «Таймаут чтения git, с» в настройках (10 с … 1 ч); все вызовы
  # идут с GIT_OPTIONAL_LOCKS=0 и GIT_TERMINAL_PROMPT=0.
  # v0.9.5: отказ объясняется словами самого хоста, а не «HTTP 400» (клиент читает тело
  # ответа), у дерева/метаданных/изменений появился индикатор загрузки, отказы уходят в
  # штатный журнал DSH через ctx.logger — своего errors.log и кнопок «открыть журнал» нет.
  # v0.9.6: языковой сервер вырезан целиком (F12 идёт по модели метаданных, Java на машине
  # не нужна), прицел дерева сравнивает пути в одной форме и ставит строку по центру,
  # контекстное меню сокращено, подсказки над кодом оформлены как сообщения DSH.
  - kind: plugin
    from: git
    url: https://github.com/Mempemp/DSH-CodeEditor_BSL.git#b9b18dd81b9b5ca93867d775b1b81d02f6003f9f
    path: dsh-bsl-editor
  # Russian localization for the web UI. Pinned exactly for the same reason as
  # the market above: the offline seed must stay reproducible, and a floating
  # range would silently change what a release delivers. 0.4.22 is the newest
  # release and its dsh-settings peer names `>=0.2.2-0 <0.2.3-0`, i.e. the line
  # this bundle carries. Its Cordis peer stays at `~4.0.4 || ~4.0.5` while the
  # 0.2.2 runtime carries Cordis 4.1.0 — that peer the host gate does not read,
  # but the Russian interface is exactly what silently falls back to English when
  # such a mismatch bites (references/shell-ui-locale.md), so it is checked on a
  # real first run, not by the manifest.
  - kind: plugin
    from: npm
    spec: "@goodandready/dsh-russian-lang@0.4.22"
  # Русские уведомления: наш компонент сборки, а не установка из маркета. Апстрим
  # (@wingsky-1/dsh-notifier 0.2.11, автор тот же, что у mcp-manager и market) отдаёт
  # текст уведомлений и страницу настроек только на китайском и английском, выбора
  # языка у него нет. Здесь лежит его сборка с русским текстом: дельта — данные в
  # packages/dsh-notifier-ru/tools/, манифест и LICENSE (MIT, © wingsky-1),
  # пересборка — `node tools/localize.mjs`. `from: local`, потому что апстрим
  # публикуется уже собранным и правится именно сборка.
  - kind: plugin
    from: local
    path: ./packages/dsh-notifier-ru
  # Браузерные инструменты для агента: 19 browser_* инструментов поверх
  # встроенного sidebar-браузера (чтение accessibility-дерева со стабильными
  # ref, CDP-ввод, скриншоты, перехват сети, cookie vault, multi-instance).
  # В npm не публикуется, поэтому from: git. Пин по коммиту, а не `#main`:
  # каталог должен доставать ровно тот код, который называет релиз
  # (a69f2ca — main на момент добавления, package.json называет версию 1.0.1).
  # ВНИМАНИЕ: в package.json плагина стоит UTF-8 BOM (EF BB BF). Старый pnpm на
  # таком манифесте падал ('Unexpected token ... is not valid JSON'), поэтому
  # плагин нельзя было поставить из маркета; pnpm 11.7.0 BOM переваривает
  # (pack и install на пиннутом коммите проверены 2026-10-20). Хостовая половина
  # использует только node builtins, установки зависимостей плагину не нужно.
  - kind: plugin
    from: git
    url: https://github.com/hermes-ai-2026/dsh-browser-agent.git#a69f2ca50e21793a7335e5c93be70695f2d4d685
  # Public 1C knowledge MCP (v8std): platform documentation search, БСП / SSL and
  # standards. `from: remote` because there is nothing to vendor — the installer
  # seeds the server into the MCP manager's global store
  # ($DSH_HOME/@wingsky-1/dsh-mcp-manager/mcp.json,
  # the list its panel shows), so it is available in every project without a
  # per-project setup and can be switched off there like any other server. Its
  # tools appear to the model as mcp__v8std__<tool>.
  - kind: mcp
    from: remote
    id: v8std
    serverName: v8std
    transport: streamable-http
    url: https://ai.v8std.ru/mcp
  # Локальная память агента: engram (MIT, Go) приезжает отдельным плагином со
  # своим репозиторием — в бандле для неё ничего не вендорится. Внутри пакета
  # и правила, и MCP-половина (бинарник engram + шим); строку сервера в
  # менеджере ($DSH_HOME/@wingsky-1/dsh-mcp-manager/mcp.json) плагин добавляет себе сам при первом
  # старте. Пин по коммиту, как у остальных наших.
  - kind: plugin
    from: git
    url: https://github.com/Mempemp/dsh-engram-memory.git#f2f28e9fb126ea44182f3cedc5410fb35ee3f19e
  # 1C ruleset as one tree, seeded to $DSH_HOME/1c-rules/payload.json + content/.
  # Delivered as a payload and nothing else: the skills inside it cross-reference
  # AGENTS.md, content/rules/* and content/agents/*, so shipping the skills tree
  # on its own — the global $DSH_HOME/skills, which every project sees — would
  # hand the agent pointers into files that are not there. The whole tree is
  # unpacked into a project on demand by dsh-1c-project-properties, which
  # rewrites the source-repository paths to the project-local ones the header of
  # each file expects. The desktop never reads this payload itself.
  # Наши собственные правила едут НЕ этим payload, а внутри плагина параметров
  # (playbook/ в его пакете): второй копии правил в каталоге быть не должно.
  # Этот набор — необязательная добавка: разворачивается только при включённом
  # флажке «Добавить правила comol» в окне проекта, и рассчитан на MCP-серверы comol.
  # Pinned to a commit, not `#main`: a floating ref would hand two installs of the
  # same build different rulesets. `version` feeds the catalog fingerprint: bump
  # it (or let the tree digest change) or an existing install keeps its old copy.
  # 18e3383d — каталог инструментов MCP-сервера KD20 синхронизирован с сервером
  # 0.5.0 (71 инструмент, песочница принимает `base` вместо URL), плюс правки правил
  # 1c-metadata-manage и дефолтного адреса поддержки.
  - kind: payload
    from: git
    url: https://github.com/comol/ai_rules_1c.git#18e3383da1e436ef980440503ae590da9b8722bf
    id: 1c-rules
    name: 1c-rules
    version: 2026.10.21-18e3383d

  # Git для 1С-редактора (dsh-bsl-editor): без него не работают диффы, индикаторы
  # изменений и кнопки «В индекс» / «Коммит». MinGit — тот же git.exe, что ставит
  # Git for Windows, но без графического интерфейса, Git Bash, Perl, справки и
  # переводов (33.7 МБ архивом против 60+ МБ установщика): ровно такую урезанную
  # сборку возит внутри себя GitHub Desktop. Первый запуск распаковывает её в
  # $DSH_HOME/git (рядом лежит cmd/git.exe) — это второе место, где редактор ищет
  # git после пути из своих настроек, — так что пользователю не нужно ничего
  # ставить. Проверка по файлу после установки: $DSH_HOME/git/cmd/git.exe.
  # version сверять с именем архива: она попадает в манифест и в отчёт сборки;
  # переустановку каталога на уже стоящей машине запускает изменившийся digest.
  - kind: tool
    from: remote
    id: uv
    name: uv
    version: 0.13.7
    url: https://github.com/astral-sh/uv/releases/download/0.13.7/uv-x86_64-pc-windows-msvc.zip
  # Анализатор кода для «1С: Анализ кода». Один файл, не архив: раскатка кладёт его в
  # $DSH_HOME/bsl-analyzer/bsl-analyzer-app-windows-amd64.exe, плагин проверяет sha256
  # и берёт оттуда — вместо прежней кнопки «Скачать» на 76 МБ. Версия закреплена:
  # набор правил в плагине — снимок именно этого движка.
  - kind: tool
    from: remote
    id: bsl-analyzer
    name: bsl-analyzer
    version: 0.4.3
    url: https://github.com/itrous/bsl-analyzer/releases/download/v0.4.3/bsl-analyzer-app-windows-amd64.exe

  # uv ставит Python-инструменты при первой раскатке каталога. Нужен потому, что часть
  # возможностей 1С — Python-пакеты, а не бинарники: у rlm-bsl-index (индекс кода) отдельного
  # exe нет, это консольная команда пакета rlm-tools-bsl. uv едет в каталоге, чтобы установка
  # была делом установщика, а не плагина в момент клика пользователя. Сеть нужна один раз:
  # uv скачивает управляемый Python и колёса пакета, дальше всё лежит в доме.
  # Проверка после установки: $DSH_HOME/rlm-tools-bsl/bin/rlm-bsl-index.exe
  - kind: tool
    from: remote
    id: uv
    name: uv
    version: 0.13.7
    url: https://github.com/astral-sh/uv/releases/download/0.13.7/uv-x86_64-pc-windows-msvc.zip
  # Ставится тем же uv в $DSH_HOME/rlm-tools-bsl/{tool,bin,python} — ровно туда, где плагин
  # dsh-rlm-tools-bsl ищет команду индекса, поэтому сам он уже ничего не докачивает.
  - kind: python
    from: pypi
    id: rlm-tools-bsl
    name: rlm-tools-bsl
    spec: rlm-tools-bsl
    version: 1.47.0
    bin: rlm-bsl-index
